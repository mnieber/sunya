[project]
name = "sunya"
description = ""
version = "1.0.0"
readme = "README.md"
dependencies = ["dataclassy", "multimethods.py", "PyYAML", "watchdog"]

[project.optional-dependencies]
dev = ["pytest", "faker", "pytest-html"]

[project.scripts]
sunya = "sunya.runtime.entrypoints.sunya:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
