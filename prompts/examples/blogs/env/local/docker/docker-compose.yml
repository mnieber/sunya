services:
  blogs_be:
    container_name: blogs_be
    build:
      context: ${ROOT_DIR}/src/services/blogs_be
      dockerfile: Dockerfile
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./env_files/blogs_be.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.local
    image: blogs_be_dev
    ports:
      - 8000:8000
  blogs_fe:
    container_name: blogs_fe
    build:
      context: ${ROOT_DIR}/src/services/blogs_fe
      dockerfile: Dockerfile
    command: sleep infinity
    env_file:
      - ./env_files/blogs_fe.env
    image: blogs_fe_dev
    ports:
      - 3000:3000
      - 6008:6008 # For Storybook
  localstack:
    container_name: blogs_localstack
    image: "localstack/localstack:3.4.0"
    ports:
      - 4566:4566
    env_file:
      - env_files/localstack.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - "${ROOT_DIR}/src/localstack/scripts/initaws.d:/docker-entrypoint-initaws.d"
  postgres:
    container_name: blogs_postgres
    env_file:
      - ./env_files/postgres.env
    image: postgres:14.0
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: {}
