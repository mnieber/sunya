COMMANDS:
  list:
    "~dm":
      run: [in: docker, cmd: python, manage.py]
    "~install":
      run: [in: docker, cmd: make, install]
    "~make":
      run: [in: docker, cmd: make]
    "~pip-compile":
      run: [in: docker, cmd: make, pip-compile]
    "~pt":
      run: [in: docker, cmd: dodo, roadplan_server.pytest, ++allow-unix-socket]
      cwd: ${/SERVER/src_dir}
      kwargs:
        ++maxfail: 10
      env: [CELERY_TASK_ALWAYS_EAGER=True, OTEL_SDK_DISABLED=True]
    "~pts":
      run: [in: docker, cmd: dodo, roadplan_server.pytest, ++allow-unix-socket]
      cwd: ${/SERVER/src_dir}
      kwargs:
        ++select-from-file: keep-tests.txt
        ++maxfail: 10
      env: [CELERY_TASK_ALWAYS_EAGER=True, OTEL_SDK_DISABLED=True]
    "~serve":
      run: [in: docker, cmd: make, run-server]
    "~shell":
      run: [in: docker, cmd: fish]

PYTEST:
  html_report: ${/SERVER/install_dir}/pytest/pytest_report.html
  python: python

DOCKER:
  container: sunya-dev-roadplan_server-1

ROOT:
  aliases:
    foo: run django-manage

SERVER:
  install_dir: /app
  src_dir: ${/SERVER/install_dir}/src
  host_src_dir: ${/ROOT/src_dir}/roadplan_server
