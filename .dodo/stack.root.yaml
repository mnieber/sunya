COMMANDS:
  list:
    "~build":
      run: [cmd: dodo, root.docker-compose, build]
    "~down":
      run: [cmd: dodo, root.docker-compose, down]
    "~down-volumes":
      run: [cmd: dodo, root.docker-compose, down, ++volumes]
    "~mk":
      run: [cmd: dodo, root.make]
      cwd: ${/SERVER/src_dir}
    "~mt":
      run: [cmd: dodo, root.menu, --tmux]
    "~up":
      run: [cmd: dodo, root.docker-compose, up, roadplan_ui, ++detach]

DOCKER_COMPOSE:
  compose_project_name: sunya-dev
  root_dir: ${/ROOT/src_dir}
  cwd: ${/ROOT/src_dir}/envs/local
  files:
    - docker-compose.yml
    - docker-compose.src-overlays.yml
    - docker-compose.venv.yml
    - docker-compose.override.yml

MENU:
  session_id: sunya
  commands:
    serve_darshana:
      - dodo darshana_be.serve
      - dodo darshana_fe.serve
      - dodo darshana_fe.storybook
    serve_landler:
      - dodo landler_be.serve
      - dodo landler_fe.serve
      - dodo landler_fe.storybook
    serve_blogs:
      - dodo blogs_be.serve
      - dodo blogs_fe.serve
      - dodo blogs_fe.storybook
    serve_roadplan:
      - dodo roadplan_server.serve
      - dodo roadplan_ui.serve

ROOT:
  aliases: {}

SERVER:
  src_dir: ${/ROOT/src_dir}
