version: "3.7"

services:
  domain:
    build:
      context: ./domain
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./domain/.env/dev.injected.env
    image: sunya_domain_dev
    volumes:
      - ./domain:/app/src
      - domain_venv:/app/env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./frontend/.env/dev.injected.env
    image: sunya_frontend_dev
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app/src
      - bundle:/app/bundle
volumes:
  domain_venv: {}
  bundle: {}
