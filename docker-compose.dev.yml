version: "3.7"

services:
  mock:
    build:
      context: ./mock
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./mock/.env/dev.injected.env
    image: sunya_mock_dev
    volumes:
      - ./mock:/app/src
      - ./sunya:/app/src/sunya
      - mock_venv:/app/env
  blogs_be:
    build:
      context: ./blogs_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./blogs_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: blogs_be_dev
    ports:
      - 8002:8002
    volumes:
      - ./blogs_be:/app/src
      - blogs_be_venv:/app/env
  blogs_fe:
    build:
      context: ./blogs_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./blogs_fe/.env/dev.injected.env
    image: blogs_fe_dev
    ports:
      - 3002:3002
      - 6008:6008
    volumes:
      - ./blogs_fe:/app/src
  darshana_be:
    build:
      context: ./darshana_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./darshana_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: darshana_be_dev
    ports:
      - 8000:8000
    volumes:
      - ./darshana_be:/app/src
      - darshana_be_venv:/app/env
  darshana_fe:
    build:
      context: ./darshana_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./darshana_fe/.env/dev.injected.env
    image: darshana_fe_dev
    ports:
      - 3000:3000
      - 6006:6006
    volumes:
      - ./darshana_fe:/app/src
  landler_be:
    build:
      context: ./landler_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./landler_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: sunya_landler_be_dev
    ports:
      - 8001:8001
    volumes:
      - ./landler_be:/app/src
      - landler_be_venv:/app/env
  landler_fe:
    build:
      context: ./landler_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./landler_fe/.env/dev.injected.env
    image: sunya_landler_fe_dev
    ports:
      - 3001:3001
      - 6007:6007
    volumes:
      - ./landler_fe:/app/src
  postgres:
    env_file:
      - ./postgres/.env/dev.injected.env
    image: postgres:14.0
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  blogs_be_venv: {}
  darshana_be_venv: {}
  landler_be_venv: {}
  mock_venv: {}
  postgres_data: {}
