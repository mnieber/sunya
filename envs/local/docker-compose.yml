services:
  mock:
    build:
      context: ./mock
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./mock/.env/dev.injected.env
    image: sunya_mock_dev
  blogs_be:
    build:
      context: ./blogs_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./blogs_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: blogs_be_dev
    ports:
      - 8002:8002
  blogs_fe:
    build:
      context: ./blogs_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./blogs_fe/.env/dev.injected.env
    image: blogs_fe_dev
    ports:
      - 3002:3002
      - 6008:6008
  darshana_be:
    build:
      context: ./darshana_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./darshana_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: darshana_be_dev
    ports:
      - 8000:8000
  darshana_fe:
    build:
      context: ./darshana_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./darshana_fe/.env/dev.injected.env
    image: darshana_fe_dev
    ports:
      - 3000:3000
      - 6006:6006
  landler_be:
    build:
      context: ./landler_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./landler_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: sunya_landler_be_dev
    ports:
      - 8001:8001
  landler_fe:
    build:
      context: ./landler_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./landler_fe/.env/dev.injected.env
    image: sunya_landler_fe_dev
    ports:
      - 3001:3001
      - 6007:6007
  roadplan_ui:
    build:
      context: ${ROOT_DIR}/apps/roadplan_ui
      dockerfile: Dockerfile.dev
    command: sleep infinity
    image: roadplan_ui_dev
    ports:
      - 3003:3003
      - 6003:6003
  postgres:
    env_file:
      - ./postgres/.env/dev.injected.env
    image: postgres:14.0
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  preline:
    build:
      context: ./preline
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./darshana_fe/.env/dev.injected.env
    image: preline_dev
    ports:
      - 3003:3003
      - 6009:6009
    volumes:
      - ./preline:/app/src
volumes:
  postgres_data: {}
