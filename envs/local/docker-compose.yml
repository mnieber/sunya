services:
  mock:
    build:
      context: ./mock
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./mock/.env/dev.injected.env
    image: sunya_mock_dev
  darshana_be:
    build:
      context: ./darshana_be
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./darshana_be/.env/dev.injected.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: darshana_be_dev
    ports:
      - 8000:8000
  darshana_fe:
    build:
      context: ./darshana_fe
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./darshana_fe/.env/dev.injected.env
    image: darshana_fe_dev
    ports:
      - 3000:3000
      - 6006:6006
  roadplan_ui:
    build:
      context: ${ROOT_DIR}/apps/roadplan_ui
      dockerfile: Dockerfile.dev
    command: sleep infinity
    depends_on:
      - roadplan_server
    env_file:
      - ./env_files/roadplan_ui.env
    image: roadplan_ui_dev
    ports:
      - 3003:3003
      - 6003:6003
  roadplan_server:
    build:
      context: ${ROOT_DIR}/apps/roadplan_server
      dockerfile: Dockerfile.dev
      additional_contexts:
        roadplan: ~/projects/roadplan/src/roadplan
    command: sleep infinity
    depends_on:
      - postgres
    env_file:
      - ./env_files/roadplan_server.env
      - ./env_files/roadplan_server.local.env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.dev
    image: roadplan_server_dev
    ports:
      - 8003:8003
  postgres:
    env_file:
      - ./env_files/postgres.env
    image: postgres:14.0
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  preline:
    build:
      context: ./preline
      dockerfile: Dockerfile.dev
    command: sleep infinity
    env_file:
      - ./darshana_fe/.env/dev.injected.env
    image: preline_dev
    ports:
      - 3003:3003
      - 6009:6009
    volumes:
      - ./preline:/app/src
volumes:
  postgres_data: {}
