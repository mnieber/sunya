name: blogs
types:
  - name: Blog
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: description
        type: Optional[str]
  - name: BlogPost
    fields:
      - name: id
        type: UUID
      - name: blog
        type: Blog
      - name: title
        type: str
      - name: content
        type: Optional[str]
      - name: isPublished
        type: bool
      - name: level
        type: BlogPostLevel
      - name: tags
        type: list[str]
mutations:
  - name: CreateBlog
    args:
      - name: createBlogForm
        type: Form
  - name: CreateBlogPost
    args:
      - name: createBlogPostForm
        type: Form
      - name: blog
        type: Blog
  - name: UpdateBlogPost
    args:
      - name: updateBlogPostForm
        type: Form
      - name: blog
        type: Blog
  - name: DeleteBlogPosts
    args:
      - name: deleteBlogPostsForm
        type: Form
queries:
  - name: GetBlogs
  - name: GetBlogTags
  - name: GetBlogPosts
states:
  - name: BlogsState
    containers:
      - name: BlogsCtr
        facets:
          - name: data
          - name: selection
          - name: highlight
  - name: BlogPostsState
    containers:
      - name: BlogPostsCtr
        facets:
          - name: data
          - name: addition
          - name: deletion
          - name: edit
          - name: highlight
          - name: selection
routes:
  - name: Blogs
  - name: Blog
state_providers:
  - name: BlogsStateProvider
  - name: BlogPostsStateProvider
views:
  BlogPostFormView(Component): {}
  BlogListView(Component): {}
  BlogPostListView(Component): {}
  BlogsPage:
    root:
      __LeftSideBar:
        blog_list_view: null
      __RightCanvas:
        blog_post_list_view: null
        blog_post_form_view: null
        create_blog_post_button: null
        edit_blog_post_button: null
        delete_blog_posts_button: null
effects:
  - name: SelectBlogEffect
components:
  CreateBlogButton(DialogButton): {}
  CreateBlogPostButton(DialogButton): {}
  EditBlogPostButton(DialogButton): {}
  DeleteBlogPostsButton(DialogButton): {}

