name: blogs
models:
  - name: Blog
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: description
        type: Optional[str]
      - name: audience
        type: str
  - name: BlogPost
    fields:
      - name: id
        type: UUID
      - name: blog
        type: Blog
      - name: title
        type: str
      - name: content
        type: Optional[str]
enums: []
actions:
  - name: create_blog
    args:
      - name: create_blog_form
        type: Form
  - name: create_blog_post
    args:
      - name: create_blog_post_form
        type: Form
      - name: blog
        type: Blog
  - name: update_blog
    args:
      - name: update_blog_form
        type: Form
      - name: blog
        type: Blog
api_views:
  - name: CreateBlog
    filters: []
  - name: CreateBlogPost
    filters: []
  - name: UpdateBlog
    filters: []

