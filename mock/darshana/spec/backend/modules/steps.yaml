name: steps
models:
  - name: FactBit
    fields:
      - name: id
        type: UUID
      - name: type_name
        type: 'str = FactBitTypeNames: string | role | actor'
      - name: value
        type: str
  - name: Step
    fields:
      - name: id
        type: UUID
      - name: fact
        type: tuple[FactBit]
      - name: parent_step
        type: Step
      - name: child_steps
        type: list[Step]
      - name: field_delta_set_by_actor_key
        type: dict[str, dict[str, Any]]
actions:
  - name: create_step
    args:
      - name: create_step_form
        type: Form
      - name: parent_step
        type: Step
api_views: []

