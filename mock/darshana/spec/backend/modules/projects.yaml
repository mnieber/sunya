type: module
name: projects
models:
  - name: Project
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: description
        type: Optional[str]
      - name: scenarios
        type: list[Scenario]
actions:
  - name: create_project
    args:
      - name: create_project_form
        type: Form
  - name: update_project
    args:
      - name: update_project_form
        type: Form
      - name: project
        type: Project
  - name: delete_projects
    args:
      - name: project_ids
        type: list[str]
  - name: import_spec_files
    args:
      - name: import_spec_files_form
        type: Form
      - name: project
        type: Project
  - name: import_scenario_spec
    args:
      - name: import_scenario_spec_form
        type: Form
      - name: project
        type: Project
  - name: import_module_spec
    args:
      - name: import_module_spec_form
        type: Form
      - name: project
        type: Project
api_views:
  - name: CreateProject
    filters: []
  - name: UpdateProject
    filters: []
  - name: DeleteProjects
    filters: []
  - name: ImportSpecFiles
    filters: []
  - name: GetProject
    filters: []
  - name: GetProjectLeads
    filters: []

