type: scenario
scenario_name: frontend/ms2-a-user-uploads-files-to-a-project
nodes:
  - root: ''
    child_nodes:
      - goal: upload [SpecFiles] to the [Project]
        pre_entity_key_by_role_name:
          Project: my-darshana-project+:project
        child_nodes:
          - step: The [alice@example.com+:user] visits the [project+:route]
          - step: The [alice@example.com+:user] presses the [import-spec-files-button:component]
          - step: The [alice@example.com+:user] selects the [SpecFiles]
          - step: The [alice@example.com+:user] deletes some of the [SpecFiles]
          - step: The [alice@example.com+:user] submits the [import-spec-files-form-view:component]
            child_nodes:
              - step: The [:frontend] calls the [import-spec-files:mutation]

