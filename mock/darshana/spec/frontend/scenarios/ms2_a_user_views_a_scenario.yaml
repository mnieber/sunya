scenario_name: ms2-a-user-views-a-scenario
nodes:
  - root: ''
    child_nodes:
      - goal: view a [Scenario] in the [my-darshana-project+:project]
        actors_introduced:
          - name: my-first+:scenario
            deltas:
              id: ff5aeda911da5d76ae711522d6d7a17e (None)
              name: My First (None)
              root_step: root:step (None)
        roles_updated:
          Scenario: my-first+:scenario
        child_nodes:
          - step: The [alice@example.com+:user] visits the [project+:route]
            child_nodes:
              - step: The [scenario-list-view:component] calls the [get-scenarios:query] to load the [Scenarios]
              - step: The [scenario-list-view:component] displays the [Scenarios]
          - step: The [alice@example.com+:user] clicks on a [Scenario]
            actors_introduced:
              - name: my-first+:scenario
                deltas:
                  id: ff5aeda911da5d76ae711522d6d7a17e (None)
                  name: My First (None)
                  root_step: root:step (None)
            roles_updated:
              Scenario: my-first+:scenario
            child_nodes:
              - step: The [alice@example.com+:user] is redirected to the [scenario+:route]
              - step: The [step-tree-view:component] shows the root steps for the [my-first+:scenario] in the [step-list-view:component]
          - step: The [alice@example.com+:user] clicks on a root level [Step]
            actors_introduced:
              - name: base-step-1:step
                deltas:
                  child_steps: '[''child-step-1:step''] (None)'
                  fact: ('Base Step 1',) (None)
                  fieldDeltaSetByActorKey: '{} (None)'
                  id: 9bb869b27c1d529c97add3304a7808af (None)
                  parent_step: None (None)
            roles_updated:
              Step: base-step-1:step
            child_nodes:
              - step: The [step-list-view:component] highlights the [Step]
                actors_introduced:
                  - name: base-step-1:step
                    deltas:
                      child_steps: '[''child-step-1:step''] (None)'
                      fact: ('Base Step 1',) (None)
                      fieldDeltaSetByActorKey: '{} (None)'
                      id: 9bb869b27c1d529c97add3304a7808af (None)
                      parent_step: None (None)
                roles_updated:
                  Step: base-step-1:step
          - step: The [alice@example.com+:user] expands a root level [Step]
            actors_introduced:
              - name: base-step-1:step
                deltas:
                  child_steps: '[''child-step-1:step''] (None)'
                  fact: ('Base Step 1',) (None)
                  fieldDeltaSetByActorKey: '{} (None)'
                  id: 9bb869b27c1d529c97add3304a7808af (None)
                  parent_step: None (None)
            child_nodes:
              - step: The [step-tree-view:component] opens a new [step-list-view:component] below the expanded [Step]
                actors_introduced:
                  - name: base-step-1:step
                    deltas:
                      child_steps: '[''child-step-1:step''] (None)'
                      fact: ('Base Step 1',) (None)
                      fieldDeltaSetByActorKey: '{} (None)'
                      id: 9bb869b27c1d529c97add3304a7808af (None)
                      parent_step: None (None)
          - goal: view the selected [Actor] in the [step-tree-view:component]
            actors_introduced:
              - name: example-actor+:actor
                deltas:
                  changed_fields: '[''field2''] (None)'
                  fields: '{''field1'': ''value1'', ''field2'': ''value2''} (None)'
                  id: 8427f8f94fca596dbb9b8c8085180942 (None)
                  key: example:actor (None)
            roles_updated:
              Actor: example-actor+:actor
            child_nodes:
              - step: The [alice@example.com+:user] clicks on the link of an [Actor]
                actors_introduced:
                  - name: example-actor+:actor
                    deltas:
                      changed_fields: '[''field2''] (None)'
                      fields: '{''field1'': ''value1'', ''field2'': ''value2''} (None)'
                      id: 8427f8f94fca596dbb9b8c8085180942 (None)
                      key: example:actor (None)
                roles_updated:
                  Actor: example-actor+:actor
                child_nodes:
                  - step: The [HighlightFacet] of the [step-tree-:state] calls the [set-highlighted-actor:action] of the [step-tree-:state]
                    child_nodes:
                      - step: The [set-highlighted-actor:action] updates the [reconstructed-actor+:actor] of the [step-tree-:state] by applying each [:field_delta_set] for the related [Step] and each [ParentStep]
                        actors_introduced:
                          - name: base-step-1:step
                            deltas:
                              child_steps: '[''child-step-1:step''] (None)'
                              fact: ('Base Step 1',) (None)
                              fieldDeltaSetByActorKey: '{} (None)'
                              id: 9bb869b27c1d529c97add3304a7808af (None)
                              parent_step: None (None)
              - step: The [actor-view:component] displays the highlighted [example-actor+:actor]
          - step: The [alice@example.com+:user] ctrl clicks on the link of the [example-actor+:actor]
            child_nodes:
              - step: The [step-tree-view:component] redirects to the [actor+:route] for the [example-actor+:actor]

