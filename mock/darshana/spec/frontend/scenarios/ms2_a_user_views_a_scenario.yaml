scenario_name: ms2-a-user-views-a-scenario
nodes:
  - root: ''
    child_nodes:
      - goal: view a [+:scenario] in the current [+:project]
        child_nodes:
          - step: The [alice@example.com+:user] visits the [project+:route]
            child_nodes:
              - step: The [scenario-list-view:component] displays the scenarios
          - step: The [alice@example.com+:user] clicks on the [my-first+:scenario]
            actors_created:
              - name: my-first+:scenario
                deltas:
                  id: ff5aeda911da5d76ae711522d6d7a17e (None)
                  name: My First (None)
                  root_step: root:step (None)
            child_nodes:
              - step: The [step-tree-view:component] shows the root steps for the [my-first+:scenario] in the [step-list-view:component]
          - step: The [alice@example.com+:user] clicks on a root level step
            child_nodes:
              - step: The [step-list-view:component] highlights the [base-step-1:step]
                actors_created:
                  - name: base-step-1:step
                    deltas:
                      child_steps: '[''child-step-1:step''] (None)'
                      fact: ('Base Step 1',) (None)
                      field_delta_set_by_actor_key: '{} (None)'
                      id: 9bb869b27c1d529c97add3304a7808af (None)
                      parent_step: None (None)
              - step: The [step-tree-view:component] opens a new [step-list-view:component] to the right
          - goal: view the selected [+:actor] in the highlighted [base-step-1:step] in the [step-tree-view:component]
            child_nodes:
              - step: The [alice@example.com+:user] clicks on the link of the [example-actor+:actor]
                actors_created:
                  - name: example-actor+:actor
                    deltas:
                      changed_fields: '[''field2''] (None)'
                      fields: '{''field1'': ''value1'', ''field2'': ''value2''} (None)'
                      id: 8427f8f94fca596dbb9b8c8085180942 (None)
                      key: example:actor (None)
                child_nodes:
                  - step: The highlight facet of the [step-list-:state] calls the [set_highlighted_step:action] of the [step-tree-:state]
                    child_nodes:
                      - step: The [set_highlighted_step:action] updates the [reconstructed-actor+:actor] of the [step-tree-:state] by applying each [:field_delta_set] for the [base-step-1:step] and all its parent steps
              - step: The [actor-view:component] displays the highlighted [example-actor+:actor]
          - step: The [alice@example.com+:user] clicks again on the link of the [example-actor+:actor]
            child_nodes:
              - step: The [step-tree-view:component] redirects to the [actor+:route] for the [example-actor+:actor]

