scenario_name: ms1-a-user-creates-a-project
nodes:
  - root: ''
    child_nodes:
      - goal: create a new [+:project] for the [+:user]
        child_nodes:
          - step: The [alice@example.com+:user] visits the [projects+:route]
          - step: The [alice@example.com+:user] enters the project name
          - step: The [alice@example.com+:user] presses the [import-files-button:component]
            child_nodes:
              - step: The [:frontend] uploads spec files
          - step: The [alice@example.com+:user] deletes some uploaded files
          - step: The [alice@example.com+:user] presses the [create-project-button:component]
            child_nodes:
              - step: The [:frontend] calls the [create-project:mutation]
          - step: The [:frontend] redirects to the [project+:route]

