scenario_name: frontend/ms1-a-user-creates-a-project
nodes:
  - root: ''
    child_nodes:
      - goal: create a new [Project] for the [alice@example.com+:user]
        roles_updated:
          Project: my-darshana-project+:project
        child_nodes:
          - step: The [alice@example.com+:user] visits the [projects+:route]
          - step: The [alice@example.com+:user] presses the [create-project-button:component]
          - step: The [alice@example.com+:user] enters the project name
          - step: The [alice@example.com+:user] submits the [project-lead-form-view:component]
            child_nodes:
              - step: The [:frontend] calls the [create-project:mutation]
          - step: The [:frontend] redirects to the [project+:route]
      - goal: delete a [Project] for the [alice@example.com+:user]
        child_nodes:
          - step: The [alice@example.com+:user] visits the [projects+:route]
          - step: The [alice@example.com+:user] presses the [delete-project-button:component]
            child_nodes:
              - step: The [:frontend] asks confirmation from the [alice@example.com+:user]
              - step: The [:frontend] calls the [delete-projects:mutation]

