type: module
name: projects
types:
  - name: ProjectLead
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: description
        type: str
  - name: Project
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: description
        type: str
      - name: scenarios
        type: list[Scenario]
mutations:
  - name: CreateProject
    args:
      - name: createProjectForm
        type: Form
  - name: UpdateProject
    args:
      - name: updateProjectForm
        type: Form
  - name: DeleteProjects
    args:
      - name: project_ids
        type: list[str]
  - name: ImportSpecFiles
    args:
      - name: project
        type: Project
      - name: files
        type: list[Any]
queries:
  - name: GetProjectLeads
  - name: GetProject
states:
  - name: ProjectLeadsState
    containers:
      - name: ProjectLeadsCtr
        facets:
          - name: data
          - name: highlight
          - name: deletion
          - name: edit
  - name: ProjectState
    containers:
      - name: ProjectCtr
        facets:
          - name: data
      - name: ScenariosCtr
        facets:
          - name: data
          - name: highlight
      - name: ActionsCtr
        actions:
          - name: importSpecFiles
routes:
  - name: Projects
  - name: Project
state_providers:
  - name: ProjectLeadsStateProvider
  - name: ProjectStateProvider
views:
  ProjectsPage(Component):
    root:
      project_list: null
  ProjectPage(Component):
    root:
      scenario_list_view: null
  ProjectListView(Component): {}
  ProjectLeadFormView(Component): {}
  ImportSpecFilesFormView(Component): {}
effects:
  - name: SelectProjectEffect
components:
  ImportSpecFilesButton(Component): {}
  CreateProjectButton(Component): {}
  DeleteProjectButton(Component): {}

