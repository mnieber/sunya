name: scenarios
types:
  - name: Scenario
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: rootStep
        type: Step
  - name: Step
    fields:
      - name: id
        type: UUID
      - name: fact
        type: tuple[str]
      - name: parentStep
        type: Step
      - name: childSteps
        type: list[Step]
      - name: fieldDeltaSetByActorKey
        type: dict[str, dict[str, Any]]
mutations: []
queries:
  - name: GetScenarios
states:
  - name: ScenariosState
    containers:
      - name: ScenariosCtr
        facets:
          - name: data
          - name: highlight
  - name: StepTreeState
    containers:
      - name: StepTreeCtr
        facets:
          - name: data
            value:
              reconstructed_actor: null
    actions:
      - name: setHighlightedActor
routes:
  - name: Scenario
state_providers:
  - name: ScenariosStateProvider
  - name: StepTreeStateProvider
views:
  ScenarioListView(Component): {}
  StepTreeView(Component): {}
  StepListView(Component):
    props:
      step: StepT
    local_state:
      is_collapsed: false
  ScenarioPage(Component):
    root:
      step_tree_view:
        step_list_views: null
      actor_view: null
effects:
  - name: SelectScenarioEffect
  - name: SelectStepEffect
components: []

