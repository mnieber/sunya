type: module
name: steps
types:
  - name: FactBit
    fields:
      - name: typeName
        type: FactBitTypeNames
      - name: value
        type: str
  - name: Step
    fields:
      - name: id
        type: UUID
      - name: fact
        type: tuple[FactBit]
      - name: parentStep
        type: Step
      - name: childSteps
        type: list[Step]
      - name: fieldDeltaSetByActorKey
        type: dict[str, dict[str, Any]]
mutations: []
queries: []
states:
  - name: StepTreeState
    containers:
      - name: StepTreeCtr
        facets:
          - name: data
            value:
              reconstructed_actor: null
      - name: ActionsCtr
        actions:
          - name: setHighlightedActor
routes: []
state_providers:
  - name: StepTreeStateProvider
views:
  StepTreeView(Component): {}
  StepListView(Component):
    props:
      step: StepT
    local_state:
      is_collapsed: false
effects:
  - name: SelectStepEffect
components: []

