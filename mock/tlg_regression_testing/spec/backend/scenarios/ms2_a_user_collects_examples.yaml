type: scenario
order: 1
scenario_name: backend/ms2_a_user_collects_examples
nodes:
  - root: ''
    child_nodes:
      - goal: collect input/output [Examples] for the [Geomodel]
        child_nodes:
          - step: The [Geomodel] runs with input
            child_nodes:
              - step: The [collect-regression-testing-examples:action] calls the [download-example-repository-stat:action] to download the current [ExampleRepositoryStat]
                actors_introduced:
                  - name: example-repository-stat:model
                    deltas:
                      nr_of_stored_examples_by_selector_name: '{''cover_crop_last_year'': 2} (None)'
                post_actor_key_by_role_name:
                  ExampleRepositoryStat: example-repository-stat:model
              - step: The [collect-regression-testing-examples:action] uses the [ExampleRepositoryStat] to determine which selectors need additional examples
                pre_actor_key_by_role_name:
                  ExampleRepositoryStat: example-repository-stat:model
              - step: The [collect-regression-testing-examples:action] runs each selected [Selector] to check if the input matches the selector criteria
                pre_actor_key_by_role_name:
                  Selector: cover_crop_last_year+:selector
                child_nodes:
                  - step: The [collect-regression-testing-examples:action] calls  [upload-example:action] to upload new examples to s3
                    child_nodes:
                      - step: The [upload-example:action] uses a dedicated [S3Filename] for the nth example to prevent writing more examples than needed

