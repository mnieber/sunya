include:
  # the base app
  - ../app/.lcopy.yaml
  # the example spec code
  - ../../mock/blogs/frontend/.lcopy.yaml
  # example source code
  - ../../../../../apps/blogs_fe/.lcopy.yaml

targets:
  generate-specs:
    instructions:
      writing_specs:
        "prompts/writing_specs/*": true

  use-specs:
