targets:
  use-specs:
    files:
      instructions:
        examples:
          bookie:
            spec:
              scenarios:
                (scenarios/<scenario_name>):
                  "*.py": true
                  "steps.py": false
              modules:
                "modules/*.py": true

  generate-specs:
    files:
      instructions:
        examples:
          bookie:
            spec:
              "*.py": true
              scenarios:
                (scenarios/<scenario_name>):
                  "*.py": true
              modules:
                "modules/*.py": true
