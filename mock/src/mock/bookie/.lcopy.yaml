targets:
  use-scenarios:
    files:
      instructions:
        examples:
          bookie:
            spec:
              scenarios:
                (scenarios/<scenario_name>):
                  "*.py": true
                  "steps.py": false
              modules:
                "modules/*.py": true

  generate-scenarios:
    files:
      instructions:
        examples:
          bookie:
            spec:
              scenarios:
                (scenarios/<scenario_name>):
                  "steps.py": true
