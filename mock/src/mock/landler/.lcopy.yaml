targets:
  copy-be-spec:
    files:
      spec:
        backend:
          scenarios:
            (backend/scenarios/<scenario_name>):
              "*": true
          modules:
            "backend/modules/*.py": true
        (roadmaps):
          "*.md": true
  copy-fe-spec:
    files:
      spec:
        frontend:
          scenarios:
            (frontend/scenarios/<scenario_name>):
              "*": true
          modules:
            "frontend/modules/*.py": true
        (roadmaps):
          "*.md": true
