type: module
name: io
models:
  - name: S3Client
    fields:
      - name: bucket_name
        type: str
  - name: ExampleRepository
    fields:
      - name: geomodel_name
        type: str
      - name: examples
        type: list[Example]
  - name: ExampleRepositoryStat
    fields:
      - name: nr_of_stored_examples_by_selector_name
        type: dict[str, int]
  - name: Example
    fields:
      - name: selector_name
        type: str
      - name: hash
        type: str
      - name: slot_nr
        type: int
      - name: input_json
        type: str
      - name: output_json
        type: str
actions:
  - name: ClearExamples
  - name: DownloadExamples
  - name: DownloadExampleRepository
  - name: DownloadExampleRepositoryStat
  - name: UploadExample

