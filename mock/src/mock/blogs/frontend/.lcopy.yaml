targets:
  use-scenarios:
    instructions:
      examples:
        spec:
          blogs:
            frontend:
              scenarios:
                (scenarios/<scenario_name>):
                  "*.py": true
                  "steps.py": false
              modules:
                "modules/*.py": true

  generate-scenarios:
    instructions:
      examples:
        spec:
          blogs:
            frontend:
              scenarios:
                (scenarios/<scenario_name>):
                  "steps.py": true
