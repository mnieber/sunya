generate-scenarios:
  instructions:
    .:
      - stack/prompts/instructions-for-*.md

use-scenarios:
  instructions:
    .:
      - stack/prompts/general-explanation-of-technical-specifications.md
      - stack/prompts/structure-of-a-*.md
    blogs:
      .:
        - stack/roadmaps/roadmap.md

use-be-scenarios:
  instructions:
    blogs:
      backend:
        scenarios:
          (backend/scenarios/[scenario_name]):
            .:
              - scenario.py
              - steps.py

use-fe-scenarios:
  instructions:
    blogs:
      .:
        - frontend

generate-be:
  instructions:
    .:
      - backend/prompts/general code generation instructions.md
      - backend/prompts/instructions-for-*.md
    spec:
      backend:
        modules:
          .:
            - backend/modules/*.py
            - backend/scenarios/**/scenario.py
    code:
      blogs_be:
        app:
          .:
            - blogs_be/app/urls.py
            - blogs_be/app/models.py
        blogs:
          .:
            - blogs_be/blogs/actions
            - blogs_be/blogs/admin.py
            - blogs_be/blogs/enums.py
            - blogs_be/blogs/models.py
            - blogs_be/blogs/permissions.py
            - blogs_be/blogs/rules
            - blogs_be/blogs/serializers.py
            - blogs_be/blogs/shortcuts.py
            - blogs_be/blogs/tests
            - blogs_be/blogs/urls.py
            - blogs_be/blogs/views
