type: module
name: checklist
types:
  - name: Checklist
    fields:
      - name: id
        type: UUID
      - name: items
        type: list[ChecklistItem]
  - name: ChecklistItem
    fields:
      - name: id
        type: UUID
      - name: name
        type: str
      - name: description
        type: str
      - name: isCompleted
        type: bool
mutations:
  - name: UpdateChecklistItems
    args:
      - name: is_completed
        type: dict[str, bool]
queries:
  - name: GetChecklist
states:
  - name: ChecklistState
    containers:
      - name: ChecklistCtr
        facets:
          - name: data
          - name: visibility
routes: []
state_providers:
  - name: ChecklistStateProvider
views:
  ChecklistView: {}
  ChecklistItem: {}
effects: []
components:
  ChecklistCard:
    props:
      trim: ''

