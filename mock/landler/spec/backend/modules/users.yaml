name: users
models:
  - name: User
    fields:
      - name: id
        type: UUID
      - name: email
        type: str
      - name: password
        type: str
      - name: is_authenticated
        type: bool
      - name: is_active
        type: bool
actions:
  - name: create_user
    args:
      - name: create_user_form
        type: Form
  - name: sign_in_user
    args:
      - name: sign_in_user_form
        type: Form
api_views:
  - name: SignUpUserApiView
    filters: []
  - name: SignInUserApiView
    filters: []
  - name: SetActiveOrganizationApiView
    filters: []

