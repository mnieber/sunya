name: project_analyses
models:
  - name: ProjectAnalysis
    fields:
      - name: id
        type: UUID
      - name: project
        type: Project
      - name: job
        type: ProjectAnalysisJob
      - name: now
        type: datetime
      - name: status
        type: ProjectAnalysisStatus
enums:
  - name: ProjectAnalysisStatus
    members:
      - name: RUNNING
        value: running
      - name: COMPLETED
        value: completed
      - name: FAILED
        value: failed
actions:
  - name: create_project_analysis
    args:
      - name: project_analysis_job
        type: ProjectAnalysisJob
  - name: run_project_analysis
    args:
      - name: project_analysis
        type: ProjectAnalysis
api_views: []

