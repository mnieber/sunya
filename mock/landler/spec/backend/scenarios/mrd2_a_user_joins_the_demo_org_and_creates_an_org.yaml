type: scenario
order: 1
scenario_name: backend/mrd2_a_user_joins_the_demo_org_and_creates_an_org
nodes:
  - root: ''
    child_nodes:
      - goal: add admin [my-org-owner@example.com+:user] to the [DemoOrganization]
        actors_introduced:
          - name: demo+:organization
            deltas:
              id: 9f540355c08a5facbca8eb43015a7313 (None)
              memberships: '[''(demo)-(my-org-owner@example.com)-(admin)+:organization-membership''] (None)'
              name: demo (None)
        post_actor_key_by_role_name:
          DemoOrganization: demo+:organization
        child_nodes:
          - step: The [add-user-to-demo-organization-:api-view] calls the [create-organization:action] to create the [DemoOrganization]
            actors_introduced:
              - name: demo+:organization
                deltas:
                  id: 9f540355c08a5facbca8eb43015a7313 (None)
                  memberships: '[] (None)'
                  name: demo (None)
            post_actor_key_by_role_name:
              DemoOrganization: demo+:organization
          - step: The [add-user-to-demo-organization-:api-view] calls the [add-user-to-organization:action]
      - goal: create an [Organization] with admin [my-org-owner@example.com+:user]
        actors_introduced:
          - name: my-org+:organization
            deltas:
              id: 93122c6d00825101b256ef9e8e830eca (None)
              memberships: '[''(my-org)-(my-org-owner@example.com)-(admin)+:organization-membership''] (None)'
              name: my-org (None)
        post_actor_key_by_role_name:
          Organization: my-org+:organization
        child_nodes:
          - step: The [create-organization-:api-view] calls the [create-organization:action]
            child_nodes:
              - step: The [create-organization:action] creates the [Organization]
                actors_introduced:
                  - name: my-org+:organization
                    deltas:
                      id: 93122c6d00825101b256ef9e8e830eca (None)
                      memberships: '[] (None)'
                      name: my-org (None)
                post_actor_key_by_role_name:
                  Organization: my-org+:organization
              - step: The [create-organization:action] calls the [add-user-to-organization:action]
      - step: The [User] uses the [organization-picker:component] in the [:frontend] to switch to the [organization+:route] of the [Organization]
        pre_actor_key_by_role_name:
          User: my-org-owner@example.com+:user
          Organization: my-org+:organization
        child_nodes:
          - step: The [User] is redirected to the [organization+:route]
            pre_actor_key_by_role_name:
              User: my-org-owner@example.com+:user
          - goal: set [Organization] as the active organization
            pre_actor_key_by_role_name:
              Organization: my-org+:organization
            child_nodes:
              - step: The [set-active-organization-:api-view] updates the [:user-session] to set the active [Organization]
                actors_updated:
                  - name: :user-session
                    deltas:
                      active_organization: my-org+:organization (None)
                pre_actor_key_by_role_name:
                  Organization: my-org+:organization

