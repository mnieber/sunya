scenario_name: backend/ms1-a-user-signs-up-and-creates-an-org
nodes:
  - root: ''
    child_nodes:
      - goal: sign up as a [User]
        child_nodes:
          - step: The [sign-up-user-:api-view] calls the [create-user:action]
            child_nodes:
              - step: The [create-user:action] creates the [User]
          - step: The [sign-up-user-:api-view] activates the account of the [User]
      - goal: sign in as a [User]
        child_nodes:
          - step: The [sign-in-user-:api-view] calls the [sign-in-user:action]
      - goal: create an [Organization] with admin [my-org-owner@example.com+:user]
        roles_updated:
          Organization: my-org+:organization
        child_nodes:
          - step: The [create-organization-:api-view] calls the [create-organization:action]
            child_nodes:
              - step: The [create-organization:action] creates the [Organization]
                roles_updated:
                  Organization: my-org+:organization
              - step: The [create-organization:action] calls the [add-user-to-organization:action]
      - step: The [User] uses the [organization-picker:component] in the [:frontend] to switch to the [route+:route] of the [Organization]
        child_nodes:
          - step: The [User] is redirected to the [route+:route]
          - goal: set [Organization] as the active organization
            child_nodes:
              - step: The [set-active-organization-:api-view] updates the [:user-session] to set the active [Organization]
                actors_updated:
                  - name: :user-session
                    deltas:
                      active_organization: Role(name='Organization', actor=Organization(name='my-org', memberships=[OrganizationMembership(organization=..., user=User(email='my-org-owner@example.com', password='my-password', is_authenticated=True, is_active=True), role='admin')])) (None)

