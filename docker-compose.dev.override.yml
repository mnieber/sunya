version: "3.7"

services:
  backend:
    volumes:
      - $HOME/.config/pudb:/root/.config/pudb
      - /opt/projects/calcium/backend/dumps:/app/dumps
      - /opt/projects/calcium/backend/fish_history:/root/.local/share/fish/fish_history
      - /opt/projects/calcium/backend/ipython:/root/.ipython
      - /opt/projects/calcium/backend/log:/app/log
      - /opt/projects/calcium/backend/media:/app/media
      - /opt/projects/calcium/backend/pytest.html:/app/pytest
      - /opt/projects/calcium/backend/static:/app/static
  calcium:
    volumes:
      - $HOME/.config/pudb:/root/.config/pudb
      - /opt/projects/calcium/calcium/fish_history:/root/.local/share/fish/fish_history
      - /opt/projects/calcium/calcium/ipython:/root/.ipython
      - /opt/projects/calcium/calcium/log:/app/log
