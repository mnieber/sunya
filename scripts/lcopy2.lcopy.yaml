# Configuration files to use (can list multiple)
sources:
  ../mock/src/kits/python_app: python_app
  ../mock/src/mock/lcopy: lcopy_mock
  ~/projects/lcopy/src: lcopy_src

targets:
  default:
    include:
      - python_app.instructions-for-generating-code
      - lcopy_mock.spec-files
      - lcopy_src.foo

options:
  # Destination directory for copied files
  destination: ~/projects/sunya/res/claude/lcopy
  # Conflict resolution strategy (overwrite, skip, prompt)
  conflict: overwrite
  # Enable verbose output
  verbose: false
  # Purge files in destination that weren't copied
  purge: true
  # Enable dry run mode (no actual copying)
  dry_run: false
